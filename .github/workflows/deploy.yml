name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_POLYGON_API_KEY: ${{ secrets.VITE_POLYGON_API_KEY }}
      VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
      VITE_ENABLE_DIRECT_POLYGON_WS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --package-lock=false

      - name: Build static site
        run: npm run build

      - name: Verify build
        run: |
          test -s dist/index.html
          test -d dist/assets

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload build
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          tar -C dist -czf /tmp/inaqstock-frontend.tgz .
          scp -i ~/.ssh/deploy_key /tmp/inaqstock-frontend.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/inaqstock-frontend.tgz"

      - name: Deploy static site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/www/wwwroot/desa.inaqstock.com
          RELEASE_DIR=$(mktemp -d /tmp/inaqstock-frontend.XXXXXX)
          trap 'rm -rf "$RELEASE_DIR" /tmp/inaqstock-frontend.tgz' EXIT

          tar -xzf /tmp/inaqstock-frontend.tgz -C "$RELEASE_DIR"
          test -s "$RELEASE_DIR/index.html"

          find "$APP_DIR" -mindepth 1 -maxdepth 1 \
            ! -name .user.ini ! -name .well-known -exec rm -rf {} +
          cp -a "$RELEASE_DIR"/. "$APP_DIR"/
          chown www:www "$APP_DIR"
          find "$APP_DIR" -mindepth 1 -maxdepth 1 \
            ! -name .user.ini ! -name .well-known -exec chown -R www:www {} +

          curl -kfsS --resolve app.nydaqstock.com:443:127.0.0.1 \
            https://app.nydaqstock.com/ >/dev/null
          REMOTE
