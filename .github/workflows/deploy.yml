name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_ENABLE_DIRECT_POLYGON_WS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Validate production configuration
        run: |
          test -n "$VITE_API_URL"
          case "$VITE_API_URL" in
            https://*) ;;
            *) echo "VITE_API_URL debe usar HTTPS" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build static site
        run: pnpm run build

      - name: Verify build
        run: |
          test -f dist/index.html
          test -d dist/assets
          if grep -R -E 'sk-(proj|or)-|re_[A-Za-z0-9_-]{12,}|mongodb://[^ ]+:[^ @]+@' dist; then
            echo "Se detectó un secreto dentro del build público" >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package static build
        run: tar -C dist -czf /tmp/inaqstock-frontend.tgz .

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: scp -i ~/.ssh/deploy_key /tmp/inaqstock-frontend.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/inaqstock-frontend.tgz"

      - name: Deploy static site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/www/wwwroot/desa.inaqstock.com
          RELEASE_DIR=$(mktemp -d /tmp/inaqstock-frontend.XXXXXX)
          BACKUP_DIR=/var/backups/inaqstock-frontend
          trap 'rm -rf "$RELEASE_DIR" /tmp/inaqstock-frontend.tgz' EXIT

          tar -xzf /tmp/inaqstock-frontend.tgz -C "$RELEASE_DIR"
          test -f "$RELEASE_DIR/index.html"
          test -d "$RELEASE_DIR/assets"

          mkdir -p "$APP_DIR" "$BACKUP_DIR"
          tar --exclude=.user.ini --exclude=.well-known -C "$APP_DIR" \
            -czf "$BACKUP_DIR/$(date +%Y%m%d-%H%M%S).tgz" . 2>/dev/null || true
          ls -1t "$BACKUP_DIR"/*.tgz 2>/dev/null | tail -n +4 | xargs -r rm -f

          # aaPanel protege .user.ini y usa .well-known para certificados.
          find "$APP_DIR" -mindepth 1 -maxdepth 1 \
            ! -name .user.ini ! -name .well-known -exec rm -rf {} +
          cp -a "$RELEASE_DIR"/. "$APP_DIR"/
          find "$APP_DIR" -mindepth 1 ! -name .user.ini -exec chown www:www {} +

          test -s "$APP_DIR/index.html"
          curl -kfsS --resolve app.nydaqstock.com:443:127.0.0.1 \
            https://app.nydaqstock.com/ >/dev/null
          REMOTE
